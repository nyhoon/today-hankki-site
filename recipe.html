<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="오늘한끼 한끼유저 레시피">
  <title>한끼유저 레시피 · 오늘한끼</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><a class="brand" href="./">오늘한끼<span>●</span></a><nav><a href="./">서비스</a><a href="seasonal.html">제철 식재료</a><a href="privacy.html">개인정보 안내</a><a href="terms.html">이용 안내</a></nav></header>
  <main class="recipe-page" id="recipe"><p class="eyebrow">한끼유저 레시피</p><h1>레시피를 불러오는 중이에요.</h1><p>오늘한끼에서 함께 나눈 한 끼를 확인하고 있어요.</p></main>
  <footer><p>운영: 뉴럴에이전트 · 문의: <a href="mailto:neuralagent.dev@gmail.com">neuralagent.dev@gmail.com</a></p></footer>
  <script>
    const root = document.getElementById('recipe');
    const id = new URLSearchParams(location.search).get('id');
    const endpoint = 'https://vnauldcdzgbhwdhsnyub.supabase.co/functions/v1/public-recipe';
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (ch) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    async function load() {
      if (!id) throw new Error('missing');
      const response = await fetch(`${endpoint}?id=${encodeURIComponent(id)}`);
      if (!response.ok) throw new Error('missing');
      return response.json();
    }
    load().then((recipe) => {
      const ingredients = Array.isArray(recipe.ingredients) ? recipe.ingredients : [];
      const steps = Array.isArray(recipe.steps) ? recipe.steps : [];
      root.innerHTML = `
        <p class="eyebrow">한끼유저 레시피</p>
        <h1>${esc(recipe.title)}</h1>
        <p class="recipe-meta">작성자 ${esc(recipe.author)} · ${esc(recipe.minutes)}분 · ${esc(recipe.servings)}인분 · 좋아요 ${esc(recipe.likes)}개</p>
        <p class="recipe-summary">${esc(recipe.summary)}</p>
        <section><h2>필요한 재료</h2><ul>${ingredients.map((item) => `<li>${esc(item.name)} <span>${esc(item.amount)}</span></li>`).join('')}</ul></section>
        <section><h2>만드는 방법</h2><ol>${steps.map((item) => `<li>${esc(item.text)}</li>`).join('')}</ol></section>
        <p class="notice">사용자 레시피는 식품 안전·알레르기 검증을 받은 조리법이 아닙니다. 재료 상태와 제품 표시를 직접 확인해주세요.</p>
        <a class="button" href="todayhankki://recipe?id=${encodeURIComponent(recipe.id)}">오늘한끼 앱에서 열기</a>`;
      document.title = `${recipe.title} · 오늘한끼`;
    }).catch(() => {
      root.innerHTML = '<p class="eyebrow">한끼유저 레시피</p><h1>레시피를 찾을 수 없어요.</h1><p>삭제됐거나 아직 공개되지 않은 레시피일 수 있어요.</p><a class="button" href="./">오늘한끼 소개로 돌아가기</a>';
    });
  </script>
</body>
</html>
