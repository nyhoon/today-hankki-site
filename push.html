<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="오늘한끼 알림 안내">
  <title>오늘한끼 알림</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><a class="brand" href="./">오늘한끼<span>●</span></a><nav><a href="./">서비스</a><a href="privacy.html">개인정보 안내</a><a href="terms.html">이용 안내</a></nav></header>
  <main class="push-page" id="push"><p class="eyebrow">오늘한끼 알림</p><h1>오늘의 키친 소식을 확인해보세요.</h1><p>앱에서 재료 날짜, 요리 추천, 장보기 목록을 한 번에 확인할 수 있어요.</p><a class="button" href="todayhankki://">오늘한끼 앱 열기</a></main>
  <footer><p>운영: 뉴럴에이전트 · 문의: <a href="mailto:neuralagent.dev@gmail.com">neuralagent.dev@gmail.com</a></p></footer>
  <script>
    const copy = {
      expiry: ['재료 날짜 알림', '먼저 확인할 재료가 있어요.', '표시 날짜가 가까운 재료를 앱의 재료 보관함에서 확인해보세요.'],
      recipes: ['보유 재료 요리 추천', '오늘 만들 수 있는 요리가 있어요.', '지금 보관 중인 재료로 만들 수 있는 레시피를 살펴보세요.'],
      shopping: ['장보기 목록 알림', '장볼 재료를 확인해볼까요?', '남아 있는 장보기 목록을 확인하고 필요한 것부터 챙겨보세요.'],
      kitchen: ['오늘의 키친 소식', '키친에 새 소식이 있어요.', '함께 쓰는 키친의 변경 내용을 확인해보세요.']
    };
    const key = new URLSearchParams(location.search).get('category');
    if (copy[key]) {
      const [eyebrow, title, body] = copy[key];
      document.getElementById('push').innerHTML = `<p class="eyebrow">${eyebrow}</p><h1>${title}</h1><p>${body}</p><a class="button" href="todayhankki://">오늘한끼 앱 열기</a>`;
      document.title = `${eyebrow} · 오늘한끼`;
    }
  </script>
</body>
</html>
